<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Wood Gold Gradient -->
    <linearGradient id="woodGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="techCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Vibrant Border -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="12" />
  <rect x="42" y="42" width="428" height="428" rx="98" fill="none" stroke="url(#woodGold)" stroke-opacity="0.4" stroke-width="4" />

  <!-- Modern Wood Timbero Furniture Emblem (Interlocking Timber Beams + WT Monogram) -->
  <!-- Top Horizontal Master Beam (T header & table crown) -->
  <rect x="106" y="118" width="300" height="60" rx="18" fill="url(#woodGold)" filter="url(#goldGlow)" />
  
  <!-- Vertical T-Stem -->
  <rect x="228" y="178" width="56" height="160" rx="14" fill="url(#woodGold)" />

  <!-- Dynamic Angled Wings of W (Precision Woodcraft & Timber Structure) -->
  <!-- Left Outer Column -->
  <path d="M 116 202 C 116 193 124 186 134 186 L 176 186 C 185 186 192 193 194 202 L 218 336 C 220 346 212 356 201 356 L 158 356 C 148 356 140 347 138 337 Z" fill="url(#techCyan)" filter="url(#cyanGlow)" />
  
  <!-- Left Inner Diagonal Beam -->
  <polygon points="184,352 242,196 262,210 208,362" fill="url(#woodGold)" opacity="0.95" />

  <!-- Right Inner Diagonal Beam -->
  <polygon points="328,352 270,196 250,210 304,362" fill="url(#woodGold)" opacity="0.95" />

  <!-- Right Outer Column -->
  <path d="M 396 202 C 396 193 388 186 378 186 L 336 186 C 327 186 320 193 318 202 L 294 336 C 292 346 300 356 311 356 L 354 356 C 364 356 372 347 374 337 Z" fill="url(#techCyan)" filter="url(#cyanGlow)" />

  <!-- Base Timber Foundation Bar -->
  <rect x="146" y="380" width="220" height="34" rx="14" fill="url(#techCyan)" opacity="0.95" />
</svg>