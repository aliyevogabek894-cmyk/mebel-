<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish – Wood Timbero</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #090d16;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #101626;
            border: 1px solid #1e293b;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        .login-header {
            padding: 36px 30px 24px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            background: #0d1220;
        }
        .brand-logo-icon {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border-radius: 14px;
            margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #fff;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }
        .login-body {
            padding: 32px 30px;
        }
        .form-control {
            background: #090d16;
            border: 1px solid #1e293b;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            background: #0c121e;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .btn-login {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            border: none;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 13px;
            border-radius: 10px;
            width: 100%;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
            transform: translateY(-1px);
        }
        .demo-credentials {
            margin-top: 24px;
            padding: 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed #1e293b;
            font-size: 0.76rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-logo-icon">
            <i class="bi bi-boxes"></i>
        </div>
        <h3 style="font-weight: 800; color: #ffffff; margin: 0; font-size: 1.4rem;">Wood Timbero</h3>
        <p style="color: #64748b; font-size: 0.8rem; margin: 4px 0 0;">Sizning hamkoringiz · Ishlab chiqarish tizimi</p>
    </div>

    <div class="login-body">
        {% if form.errors %}
            <div class="alert alert-danger" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-size: 0.82rem; border-radius: 8px;">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Login yoki parol noto'g'ri!
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person me-1"></i> Login</label>
                <input type="text" name="username" class="form-control" placeholder="admin / arrachi / kromkachi" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-lock me-1"></i> Parol</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-1"></i> Tizimga kirish
            </button>
        </form>

        <div class="demo-credentials">
            <strong style="color:#94a3b8; display:block; margin-bottom:4px;">Test kirish ma'lumotlari:</strong>
            <div>• Operator: <code>admin</code> / <code>admin123</code></div>
            <div>• Arrachi: <code>arrachi</code> / <code>arrachi123</code></div>
            <div>• Kromkachi: <code>kromkachi</code> / <code>kromkachi123</code></div>
        </div>
    </div>
</div>

</body>
</html>
